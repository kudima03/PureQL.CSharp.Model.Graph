name: .NET build & test

on:
  pull_request:
    branches: [ "main" ]

env:
  COVERAGE_WARNING_THRESHOLD: 99
  COVERAGE_THRESHOLD: 97
  MUTATION_THRESHOLD: 80

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore tools
      run: dotnet tool restore
    - name: Build
      run: dotnet build --no-restore -warnaserror
    - name: Check the mapping is generated from the referenced model
      run: |
        dotnet run --no-build --project PureQL.CSharp.Model.Graph.Generator
        git add --intent-to-add PureQL.CSharp.Model.Graph/Generated
        git diff --exit-code -- PureQL.CSharp.Model.Graph/Generated
    - name: Code style check by dotnet format
      run: dotnet format --verify-no-changes
    - name: Code style check by csharpier
      run: dotnet csharpier check .
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
    - name: Publish the Native AOT check
      run: dotnet publish Tests/PureQL.CSharp.Model.Graph.AotTests --configuration Release --output aot
    - name: Run the Native AOT check
      run: ./aot/PureQL.CSharp.Model.Graph.AotTests
    - name: Combine Coverage Reports
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
      with:
        reports: "**/*.cobertura.xml"
        targetdir: "${{ github.workspace }}"
        reporttypes: "Cobertura"
        verbosity: "Info"
        title: "Code Coverage"
        tag: "${{ github.run_number }}_${{ github.run_id }}"
        toolpath: "reportgeneratortool"
    - name: Create Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: "Cobertura.xml"
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: false
        indicators: true
        output: both
        thresholds: "${{ env.COVERAGE_THRESHOLD }} ${{ env.COVERAGE_WARNING_THRESHOLD }}"
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      continue-on-error: true
      with:
        recreate: true
        path: code-coverage-results.md
    # - name: Run mutation test
    #   run: dotnet stryker --mutation-level Complete --break-at ${{ env.MUTATION_THRESHOLD }}
